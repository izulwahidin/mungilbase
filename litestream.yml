# Continuous backup for the SQLite file.
# Used by the `litestream` service in docker-compose.yml (profile: backup).
#
# Restore procedure (test it before you need it):
#   docker compose run --rm litestream restore -o /data/restored.db \
#     -config /etc/litestream.yml /data/mungil.db
#   # stop the app, swap files, start the app
dbs:
  - path: /data/mungil.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: mungilbase
        region: ${LITESTREAM_REGION}
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
        sync-interval: 10s
        # Verify a restore monthly. An untested backup is not a backup.
