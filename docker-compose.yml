services:
  mungilbase:
    build: .
    image: mungilbase:0.2.0
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      MUNGIL_CONFIG: /app/mungil.config.json
      MUNGIL_DB_FILE: /data/mungil.db
      PORT: "8787"
    volumes:
      - ./data:/data
      - ./mungil.config.json:/app/mungil.config.json:ro
    # Uncomment when running Litestream as a sidecar (see litestream.yml).
    # depends_on:
    #   litestream:
    #     condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: continuous backup of the SQLite file to S3-compatible storage.
  # Set the LITESTREAM_* variables in .env and remove the profile.
  litestream:
    image: litestream/litestream:0.3.13
    profiles: ["backup"]
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:?set in .env}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:?set in .env}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:?set in .env}
